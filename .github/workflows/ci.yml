name: CI
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-C target-cpu=generic'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked
      - run: cargo test --all-features --locked --release
      - run: cargo build --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/server-smoke.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo +1.89.0 check --all-features --locked

  numeric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare HTTP pages against Java Lucene
        run: |
          mkdir -p "$RUNNER_TEMP/numeric-parity"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/lucene/lucene-core/10.5.2/lucene-core-10.5.2.jar -o "$RUNNER_TEMP/numeric-parity/lucene-core.jar"
          javac -cp "$RUNNER_TEMP/numeric-parity/lucene-core.jar" -d "$RUNNER_TEMP/numeric-parity" tests/reference/NumericParity.java
          java -cp "$RUNNER_TEMP/numeric-parity:$RUNNER_TEMP/numeric-parity/lucene-core.jar" NumericParity > "$RUNNER_TEMP/numeric-parity/reference.tsv"
          cargo build --locked
          python3 scripts/server-smoke.py "$RUNNER_TEMP/numeric-parity/reference.tsv"
