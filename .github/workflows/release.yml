name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Strata version in Cargo.toml (without v)'
        required: true
        type: string
      dry_run:
        description: 'Run checks only; do not create a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: strata-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          if version != os.environ['VERSION']:
              raise SystemExit('Requested version must match Cargo.toml')
          PY
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source release at tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Strata v$VERSION" --generate-notes
